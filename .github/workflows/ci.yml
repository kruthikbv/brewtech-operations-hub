name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: brewtech_test
          POSTGRES_USER: brewtech_user
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U brewtech_user -d brewtech_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SECRET_KEY: ci-secret-key-long-enough-for-jwt-validation
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: brewtech_test
      POSTGRES_USER: brewtech_user
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_SSLMODE: disable

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            frontend/requirements.txt
      - name: Install dependencies
        run: pip install -r backend/requirements.txt -r frontend/requirements.txt
      - name: Check migrations
        run: python backend/manage.py makemigrations --check --dry-run
      - name: Apply migrations
        run: python backend/manage.py migrate --noinput
      - name: Validate Django and OpenAPI
        run: |
          DJANGO_SECURE_SSL_REDIRECT=True DJANGO_SECURE_HSTS_SECONDS=31536000 python backend/manage.py check --deploy
          python backend/manage.py spectacular --validate --file /tmp/schema.yml
          python backend/manage.py collectstatic --noinput
      - name: Run tests
        run: python backend/manage.py test clients machines inventory service_records accounts dashboard
      - name: Compile Python sources
        run: python -m compileall -q backend frontend
